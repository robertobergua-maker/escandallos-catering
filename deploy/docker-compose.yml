# Despliegue en una VM siempre encendida (Oracle Cloud Always Free).
# Uso: ver docs/despliegue_oracle.md
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: ..
    image: escandallos:latest
    restart: unless-stopped
    volumes:
      # Mismo secrets.toml que se usaba en Streamlit Cloud. Vive fuera del
      # repo (/opt/escandallos/secrets), con permisos 600 y dueño UID 10001.
      - ${SECRETS_FILE:-/opt/escandallos/secrets/secrets.toml}:/app/.streamlit/secrets.toml:ro
    # Solo accesible desde la red interna de Docker; la entrada pública es Caddy.
    expose:
      - "8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  # Proxy inverso con HTTPS automático (Let's Encrypt). APP_DOMAIN admite
  # varios dominios separados por comas; REDIRECT_DOMAIN redirige (301) a
  # CANONICAL_DOMAIN.
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - REDIRECT_DOMAIN=${REDIRECT_DOMAIN}
      - CANONICAL_DOMAIN=${CANONICAL_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

  # Evita que Supabase Free pause el proyecto por inactividad (7 días).
  # Desactivado hasta la fase del latido: se activa con
  #   docker compose --profile keepalive up -d
  supabase-keepalive:
    image: curlimages/curl:latest
    profiles: ["keepalive"]
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -sS -o /dev/null -w "$$(date -Iseconds) Supabase status: %{http_code}\n" \
            "$$SUPABASE_URL/rest/v1/alergenos?select=*&limit=1" \
            -H "apikey: $$SUPABASE_KEY" \
            -H "Authorization: Bearer $$SUPABASE_KEY"
          sleep 21600
        done
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
