name: Supabase keepalive

on:
  schedule:
    # Una vez al día a las 07:00 UTC (09:00 hora de Madrid en verano).
    # Suficiente para mantener el proyecto activo en el plan gratuito de Supabase
    # (se pausa tras 7 días de inactividad).
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # permite lanzarlo manualmente desde GitHub Actions

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/alergenos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: respuesta inesperada de Supabase ($STATUS)"
            exit 1
          fi
